{% extends "base.html" %}
{% block title %}404 Not Found — FileGuard{% endblock %}
{% block content %}
<div class="container" style="max-width: 600px; padding: 5rem 1.5rem; text-align: center;">
  <h1 style="font-size: 4rem; font-weight: 800; color: var(--accent-cyan); font-family: var(--font-mono);">404</h1>
  <h2 style="font-size: 1.75rem; font-weight: 700; margin-bottom: 0.5rem;">Resource Not Found</h2>
  <p style="color: var(--text-muted); margin-bottom: 2rem;">The requested URL or resource does not exist on this server.</p>
  <a href="{{ url_for('public.index') }}" class="btn btn-primary">Return to Homepage</a>
</div>
{% endblock %}
