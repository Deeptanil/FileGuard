<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 3D Hard Shadow -->
  <path d="M32 6 L54 16 L54 36 C54 48 32 58 32 58 C32 58 10 48 10 36 L10 16 Z" 
        transform="translate(4, 4)" 
        fill="#000000" />
  
  <!-- Outer Shield Border (Black Neo-Brutalist) -->
  <path d="M32 6 L54 16 L54 36 C54 48 32 58 32 58 C32 58 10 48 10 36 L10 16 Z" 
        fill="#FF2E93" 
        stroke="#000000" 
        stroke-width="5" 
        stroke-linejoin="round" />

  <!-- Inner Cyan Accent Layer -->
  <path d="M32 12 L48 20 L48 35 C48 44 32 52 32 52 C32 52 16 44 16 35 L16 20 Z" 
        fill="#00F0FF" 
        stroke="#000000" 
        stroke-width="3" 
        stroke-linejoin="round" />

  <!-- Hard Black Checkmark with 3D Pop -->
  <path d="M24 32 L29 37 L40 25" 
        fill="none" 
        stroke="#000000" 
        stroke-width="6" 
        stroke-linecap="square" 
        stroke-linejoin="miter" />

  <!-- Checkmark Pop Color (Yellow) -->
  <path d="M24 32 L29 37 L40 25" 
        fill="none" 
        stroke="#FFE600" 
        stroke-width="3" 
        stroke-linecap="square" 
        stroke-linejoin="miter" />
</svg>
